<main>

<section id="contacto">

<h2>Formulario de Registro</h2>

<form
id="contact-form"
action="Pagina final tienda de sonidos.html"
method="POST"
>

<label>Nombre Completo</label>

<input
type="text"
id="usuario"
name="usuario"
placeholder="Tu nombre"
required
>

<label>Correo Electrónico</label>

<input
type="email"
id="email"
name="email"
placeholder="ejemplo@gmail.com"
required
>

<label>Edad</label>

<input
type="number"
id="edad"
name="edad"
placeholder="Tu edad"
required
>

<label>Dirección</label>

<input
type="text"
id="direccion"
name="direccion"
placeholder="Tu dirección"
required
>

<label>Teléfono</label>

<input
type="tel"
id="telefono"
name="telefono"
placeholder="809-000-0000"
required
>

<label>Contraseña</label>

<input
type="password"
id="contrasena"
name="contrasena"
placeholder="Contrasena"
required
>

<div class="botones">

<button type="submit">
  

Registrar

</button>

<button type="reset">

Nuevo

</button>

<h3>O Iniciar Sesion con Google</h3>
</div>

>
